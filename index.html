<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh tương tác - Khả năng truy cập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thư viện ảnh tương tác (Hỗ trợ truy cập)</h1>

    <div id="image">
        Di chuột qua hoặc dùng phím Tab để chọn hình ảnh bên dưới.
    </div>

    <div class="gallery">
        <img class="preview" src="https://picsum.photos/id/10/500/300" alt="Phong cảnh thiên nhiên núi rừng xanh mát." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/20/500/300" alt="Đoàn tàu hỏa đang di chuyển qua thung lũng." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/30/500/300" alt="Chiếc máy ảnh cổ đặt trên bàn làm việc." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/40/500/300" alt="Cảnh sắc hoàng hôn rực rỡ bên bờ biển." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/50/500/300" alt="Bức tường gạch cổ kính phủ đầy rêu phong." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/60/500/300" alt="Con đường nhỏ uốn lượn qua những tán cây." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    </div>

    <script src="script.js"></script>
</body>
</html>
