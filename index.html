<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh tương tác - Khả năng truy cập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thư viện ảnh tương tác (Hỗ trợ truy cập)</h1>

    <div id="image">
        Di chuột qua hoặc dùng phím Tab để chọn hình ảnh bên dưới.
    </div>

    <div class="gallery">
        <img class="preview" src="https://picsum.photos/id/1015/500/300" alt="Phong cảnh dòng sông bình yên dưới bóng cây." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/1040/500/300" alt="Ngọn hải đăng đứng sừng sững giữa biển khơi bao la." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/1043/500/300" alt="Cây cầu cổ kính vắt ngang qua dòng nước thơ mộng." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://images.unsplash.com/photo-1519501025264-65ba15a82390" alt="Thành phố lớn lung linh ánh đèn về đêm." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/1069/500/300" alt="Con đường mòn uốn lượn xuyên qua khu rừng xanh." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/1084/500/300" alt="Chú chim mòng biển đang bay lượn trên mặt biển." onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    </div>

    <script src="script.js"></script>
</body>
</html>
